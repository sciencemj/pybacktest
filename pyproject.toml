[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "pybacktest"
version = "0.2.0"
description = "A deterministic, extensible Python backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sciencemj", email = "sciencemj.park@gmail.com"}]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
data = ["pandas>=2.2"]
parquet = ["pandas>=2.2", "pyarrow>=17"]
yfinance = ["yfinance>=0.2"]
plot = ["matplotlib>=3.9"]

[dependency-groups]
dev = [
    "hypothesis",
    "pandas>=2.2",
    "pyarrow>=17",
    "pytest>=8",
    "pytest-benchmark",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "performance: measured runtime and peak-RSS gate; run it explicitly",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
